<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Kicks District — Nova coleção</title>
  <desc id="desc">Peça publicitária vetorial para a marca Kicks District, com um tênis urbano estilizado e chamada para explorar a coleção.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141719"/><stop offset="0.55" stop-color="#080a0c"/><stop offset="1" stop-color="#1c2023"/></linearGradient>
    <linearGradient id="shoeUpper" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.36" stop-color="#dfe3e5"/><stop offset="0.72" stop-color="#aeb6bb"/><stop offset="1" stop-color="#f3f5f5"/></linearGradient>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#353b3f"/><stop offset="0.38" stop-color="#111416"/><stop offset="1" stop-color="#030405"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff744d"/><stop offset="1" stop-color="#f13f22"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5933" stop-opacity="0.02"/><stop offset="0.5" stop-color="#ff5933" stop-opacity="0.28"/><stop offset="1" stop-color="#ff5933" stop-opacity="0.02"/></linearGradient>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="20"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/></pattern>
    <clipPath id="shoeClip"><path d="M642 603 C674 587 698 546 723 465 C739 415 765 385 811 382 C851 377 890 397 944 414 L1042 443 C1110 461 1170 435 1237 444 C1321 454 1383 485 1437 527 C1461 545 1476 570 1456 590 C1434 613 1397 628 1352 638 C1228 666 1064 649 936 651 L738 641 C686 638 652 625 642 603Z"/></clipPath>
  </defs>
  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1195" cy="500" r="360" fill="none" stroke="#ff5933" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="1195" cy="500" r="295" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
  <circle cx="1185" cy="515" r="210" fill="#f14a28" opacity="0.13" filter="url(#glow)"/>
  <path d="M840 0 L1600 0 L1600 530 Z" fill="url(#glass)" opacity="0.6"/>
  <path d="M970 120 L1530 120" stroke="#ffffff" stroke-opacity="0.12"/>
  <path d="M1050 135 L1530 135" stroke="#ff5933" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M0 850 L1600 540" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>

  <!-- Brand mark -->
  <g transform="translate(78 60)">
    <path d="M3 37 L21 3 L48 3 L32 31 L49 31 L69 3 L91 3 L71 39 C66 49 58 54 45 54 L0 54 L14 29 L30 29 L25 39 L38 39 L47 23 L22 23 L12 43 Z" fill="#fff" transform="translate(0 2) scale(.86)"/>
    <text x="91" y="23" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">KICKS</text>
    <text x="91" y="49" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4.2">DISTRICT</text>
  </g>
  <text x="1525" y="91" fill="#9da4a8" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" letter-spacing="3">EST. FOR THE STREETS</text>

