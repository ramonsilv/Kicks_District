  <!-- Floating product label -->
  <g font-family="Arial, Helvetica, sans-serif" transform="translate(1263 773)">
    <path d="M0 0 H248" stroke="#ff5933" stroke-width="2"/>
    <text x="0" y="29" font-size="12" letter-spacing="3" fill="#ff876d">KICKS DISTRICT / 001</text>
    <text x="0" y="60" font-size="23" font-weight="800" letter-spacing="1" fill="#f7f8f8">STREET FORM</text>
    <text x="0" y="84" font-size="14" fill="#9fa8ad" letter-spacing="1.1">Feito para se destacar.</text>
  </g>

  <!-- Footer -->
  <path d="M80 900 H1520" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="80" y="940" fill="#a0a7ab" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.6">KICK YOUR OWN WAY.</text>
  <text x="1520" y="940" fill="#a0a7ab" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.2" text-anchor="end">KICKSDISTRICT  •  STREETWEAR / SNEAKER CULTURE</text>
