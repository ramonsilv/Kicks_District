    <rect x="82" y="230" width="190" height="35" rx="17.5" fill="#ff5933" fill-opacity="0.14" stroke="#ff5933" stroke-opacity="0.7"/>
    <circle cx="103" cy="247.5" r="4" fill="#ff5933"/>
    <text x="118" y="252.5" font-size="12" font-weight="700" letter-spacing="2.5" fill="#ff8668">DROP 01  /  NOVA COLEÇÃO</text>
    <text x="78" y="355" font-size="69" font-weight="800" letter-spacing="-2.4" fill="#f7f8f8">SEU PRÓXIMO</text>
    <text x="78" y="433" font-size="77" font-weight="900" letter-spacing="-2.8" fill="#f7f8f8">NÍVEL</text>
    <text x="365" y="433" font-size="77" font-weight="900" letter-spacing="-2.8" fill="#ff5933">COMEÇA</text>
    <text x="78" y="511" font-size="77" font-weight="900" letter-spacing="-2.8" fill="#f7f8f8">NOS PÉS.</text>
    <rect x="81" y="552" width="63" height="4" rx="2" fill="#ff5933"/>
    <text x="80" y="594" font-size="21" fill="#bdc3c6" letter-spacing="0.2">Design que acompanha seu ritmo.</text>
    <text x="80" y="625" font-size="21" fill="#bdc3c6" letter-spacing="0.2">Atitude que abre seu caminho.</text>
    <g transform="translate(80 690)">
      <rect width="275" height="64" rx="4" fill="#ff5933"/>
      <text x="26" y="39" fill="#fff" font-size="15" font-weight="800" letter-spacing="2.3">EXPLORE A COLEÇÃO</text>
      <path d="M235 24 L247 32 L235 40 M219 32 H246" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="82" y="811" fill="#8c959a" font-size="12" letter-spacing="3">ESTILO • CONFORTO • MOVIMENTO</text>
  </g>

